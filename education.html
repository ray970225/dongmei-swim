<body class="member-shell education-page">
  <header class="v2-header">
    <a class="v2-wordmark" href="index.html" aria-label="東美游泳隊首頁"><span class="wordmark-t">TMSC</span><span class="wordmark-name">東美游泳隊</span></a>
    <nav class="v2-nav" aria-label="主選單"><a href="index.html">首頁</a><a href="results.html">公開成績</a><a class="active" href="education.html">會員專區</a><a id="athleteNavLink" href="athletes.html" hidden>選手資料</a></nav>
    <div class="account-nav"><span id="memberLabel">會員專區登入</span><a class="text-button" id="adminLink" href="admin-v2.html" hidden>管理台</a><button class="text-button" id="signOutButton" type="button" hidden>登出</button></div>
  </header>

  <main class="member-main education-main">
    <section id="configNotice" class="notice" hidden><h1>會員專區暫時無法連線</h1><p>登入服務設定完成後，東美會員即可在此使用隊內升學資料庫。</p></section>
    <section id="loginPanel" class="login-layout" hidden>
      <div class="login-copy"><h1>東美會員<br><span class="aqua-text">專區</span></h1><p>登入後即可使用隊內會員功能，包含升學資料庫中的升學與招生文章、重要日期和隊內附件。</p><div class="lane-rule" aria-hidden="true"></div><span class="small-label">加入東美，由教練團邀請開通</span></div>
      <form id="loginForm" class="login-form"><div id="loginFields"><label for="email">會員電子郵件</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button-primary" type="submit">登入會員專區</button><p><a class="text-button" href="forgot-password.html">忘記密碼？</a></p><p class="small-note">會員帳號由教練團邀請建立。登入後會依帳號權限進入會員專區或教練管理台；尚未加入東美？<a href="index.html#recruit">了解入隊方式</a>。</p></div><div id="passwordSetup" hidden><h2>建立你的會員密碼</h2><p class="small-note">這是首次登入設定，不需要預設密碼。請建立至少 10 個字元的個人密碼，之後使用邀請信中的電子郵件登入。</p><label for="newPassword">設定新密碼</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required><label for="confirmPassword">再次輸入新密碼</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required><button class="button-primary" id="savePassword" type="button">設定密碼並進入會員專區</button></div><p id="loginError" class="form-error" role="alert"></p></form>
    </section>

    <section id="educationApp" hidden>
      <div id="memberWorkspaceRoot"></div>
    </section>
  </main>
