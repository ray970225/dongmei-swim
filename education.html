<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#071318">
  <title>東美會員專區｜東美游泳隊</title>
  <link rel="stylesheet" href="assets/css/v2.css?v=tmsc-member-education-cards-1">
</head>
<body class="member-shell education-page">
  <header class="v2-header">
    <a class="v2-wordmark" href="index.html" aria-label="東美游泳隊首頁"><span class="wordmark-t">TMSC</span><span class="wordmark-name">東美游泳隊</span></a>
    <nav class="v2-nav" aria-label="主選單"><a href="index.html">首頁</a><a href="results.html">公開成績</a><a class="active" href="education.html">會員專區</a><a id="athleteNavLink" href="athletes.html" hidden>選手資料</a></nav>
    <div class="account-nav"><span id="memberLabel">會員專區登入</span><a class="text-button" id="adminLink" href="admin-v2.html" hidden>管理台</a><button class="text-button" id="signOutButton" type="button" hidden>登出</button></div>
  </header>

  <main class="member-main education-main">
    <section id="configNotice" class="notice" hidden><h1>會員專區暫時無法連線</h1><p>登入服務設定完成後，東美會員即可在此使用隊內升學資料庫。</p></section>
    <section id="loginPanel" class="login-layout" hidden>
      <div class="login-copy"><h1>東美會員<br><span class="aqua-text">專區</span></h1><p>登入後即可使用隊內會員功能，包含升學資料庫中的升學與招生文章、重要日期和隊內附件。</p><div class="lane-rule" aria-hidden="true"></div><span class="small-label">加入東美，由教練團邀請開通</span></div>
      <form id="loginForm" class="login-form"><div id="loginFields"><label for="email">會員電子郵件</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button-primary" type="submit">登入會員專區</button><p><a class="text-button" href="forgot-password.html">忘記密碼？</a></p><p class="small-note">會員帳號由教練團邀請建立。登入後會依帳號權限進入會員專區或教練管理台；尚未加入東美？<a href="index.html#recruit">了解入隊方式</a>。</p></div><div id="passwordSetup" hidden><p class="eyebrow">FIRST SIGN-IN</p><label for="newPassword">設定新密碼</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required><label for="confirmPassword">再次輸入新密碼</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required><button class="button-primary" id="savePassword" type="button">設定密碼並繼續</button></div><p id="loginError" class="form-error" role="alert"></p></form>
    </section>

    <section id="educationApp" hidden>
      <section class="member-home-heading"><h1>會員專區</h1><p>東美隊內資訊與會員服務集中於此。</p></section>
      <section class="education-hero"><div><h2>升學資料庫</h2><p>升學、招生文章與重要日期，登入後即可查閱。</p></div></section>
      <section class="library-section">
        <div class="library-heading">
          <h2>最新資訊</h2>
          <label class="search-field">
            <span class="sr-only">搜尋隊內文章</span>
            <input id="articleSearch" type="search" placeholder="搜尋文章、學校或關鍵字" autocomplete="off">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
          </label>
        </div>
        <section class="deadline-strip" id="deadlineStrip" aria-label="近期重要日期" hidden>
          <h3>近期重要日期</h3>
          <div id="deadlineList" class="deadline-list"></div>
        </section>
        <div class="category-list" id="categoryList" aria-label="文章分類"></div>
        <div id="articleList" class="article-list" aria-live="polite"></div>
      </section>
      <section id="reader" class="reader" hidden><button id="backToLibrary" class="text-button" type="button">← 回到文章列表</button><article><p class="eyebrow" id="readerCategory"></p><h2 id="readerTitle"></h2><p class="reader-summary" id="readerSummary"></p><div class="reader-body" id="readerBody"></div><div id="readerAttachments" class="reader-attachments"></div></article></section>
    </section>
  </main>
  <script src="assets/js/runtime-config.js"></script>
  <script type="module" src="assets/js/education.js?v=20260929-member-cards-1"></script>
</body>
</html>
