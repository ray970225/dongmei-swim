  <title>重設密碼｜東美游泳隊</title>
  <link rel="stylesheet" href="assets/css/v2.css?v=tmsc-brand-1">
</head>
<body class="member-shell">
  <header class="v2-header">
    <a class="v2-wordmark" href="index.html" aria-label="東美游泳隊首頁"><span class="wordmark-t">TMSC</span><span class="wordmark-name">東美游泳隊</span></a>
    <nav class="v2-nav" aria-label="主選單"><a href="index.html">首頁</a><a href="results.html">公開成績</a><a class="active" href="education.html">升學資料庫</a></nav>
  </header>
  <main class="member-main">
    <section id="configNotice" class="notice" hidden><p class="eyebrow">SETUP REQUIRED</p><h1>隊內資料庫準備中</h1><p>目前無法連線到會員登入服務，請稍後再試或聯絡教練團。</p></section>
    <section id="resetPanel" class="login-layout" hidden>
      <div class="login-copy"><p class="eyebrow">TMSC · ACCOUNT ACCESS</p><h1>重新設定<br><span class="aqua-text">登入密碼。</span></h1><p>輸入受邀加入東美會員時使用的電子郵件。我們會寄送安全連結，讓你設定新密碼。</p><div class="lane-rule" aria-hidden="true"></div><span class="small-label">MEMBER ACCOUNT RECOVERY</span></div>
      <form id="resetRequestForm" class="login-form">
        <label for="resetEmail">會員電子郵件</label>
        <input id="resetEmail" name="email" type="email" autocomplete="username" required>
        <button id="sendResetButton" class="button-primary" type="submit">寄送重設連結 <span aria-hidden="true">↗</span></button>
        <p id="resetMessage" class="small-note" role="status" aria-live="polite">若忘記登入信箱，請直接聯絡教練團。</p>
        <p id="resetError" class="form-error" role="alert"></p>
        <a class="text-button" href="education.html">← 返回會員登入</a>
      </form>
    </section>
  </main>
  <script src="assets/js/runtime-config.js"></script>
  <script type="module" src="assets/js/forgot-password.js?v=20260925-2"></script>
</body>
