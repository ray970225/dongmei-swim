name: 同步游泳成績

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase sync job ID
        required: true
        type: string
      requested_by:
        description: Admin profile ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: swim-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SWIM_SOURCE_AUTOMATION_AUTHORIZED: ${{ secrets.SWIM_SOURCE_AUTOMATION_AUTHORIZED }}

    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝專案套件
        run: npm ci

      - name: 檢查資料庫同步設定
        run: |
          if { [ -n "$SUPABASE_URL" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; } || { [ -z "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "Supabase 同步僅設定了一半；為避免公開快照包含會員資料，停止同步。"
            exit 1
          fi

      - name: 檢查成績來源授權
        run: |
          if [ "$SWIM_SOURCE_AUTOMATION_AUTHORIZED" != "true" ]; then
            echo "尚未確認 Swim Insights 對東美自動擷取的授權，停止 crawler。"
            exit 1
          fi

      - name: 安裝 Chromium 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: 標記會員觸發的工作開始
        if: github.event_name == 'workflow_dispatch' && inputs.job_id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --silent --show-error --fail --request PATCH \
            --url "$SUPABASE_URL/rest/v1/sync_jobs?id=eq.$JOB_ID" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data '{"status":"running","started_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)'"'"}'

      - name: 同步游泳成績
        env:
          SWIM_STORAGE_STATE_BASE64: ${{ secrets.SWIM_STORAGE_STATE_BASE64 }}
        run: npm run swim:sync

      - name: 匯入東美成績資料庫
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SWIM_SYNC_JOB_ID: ${{ inputs.job_id }}
        run: npm run supabase:import

      - name: 驗證同步資料
        run: npm run swim:check

      - name: 提交更新資料
        run: |
          if git diff --quiet; then
            echo "沒有資料變更，不建立提交。"
            exit 0
          fi
          git config user.name "dongmei-swim-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swim-results.json data/swim-results-meta.json data/swim-honours.json data/swim-sync-status.json
          git commit -m "自動同步游泳成績"
          git push

      - name: 記錄同步失敗
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.job_id != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl --silent --show-error --fail --request PATCH \
            --url "$SUPABASE_URL/rest/v1/sync_jobs?id=eq.$JOB_ID" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data '{"status":"failed","finished_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)'"'","error_count":1,"summary":{"error":"workflow step failed; inspect private Actions log"}}'
